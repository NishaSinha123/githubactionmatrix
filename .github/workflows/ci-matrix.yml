
name: Node.js Matrix CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # ✅ Updated to v5 (Node 24 compatible)
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6  # ✅ Updated to v6 (Node 24 compatible)
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run app
        run: node index.js